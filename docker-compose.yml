services:
  pihole:
    depends_on:
      - unbound
    container_name: pihole-vlan
    hostname: nebula-pihole
    image: pihole/pihole:latest
    shm_size: "256mb"
    mac_address: de:ad:be:ef:00:02
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    networks:
      pihole_macvlan:
        ipv4_address: 192.168.1.244
        ipv6_address: fd00:beef::244
    dns:
      - 127.0.0.1  # self: use Pi-hole's own resolution instead of leaking to public DNS
      - ::1
    environment:
      - TZ=America/New_York
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      # Answer every network, including the router's iot network (172.16.0.0/24). LOCAL would refuse it.
      - FTLCONF_dns_listeningMode=ALL
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

  unbound:
    container_name: unbound
    image: klutchell/unbound:latest
    cap_add:
      - NET_ADMIN
    networks:
      pihole_macvlan:
        ipv4_address: 192.168.1.245
        ipv6_address: fd00:beef::245
    healthcheck:
      test: ["CMD", "drill-hc", "@127.0.0.1", "dnssec.works"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    dns:
      - 1.1.1.1  # Cloudflare DNS
      - 8.8.8.8  # Google DNS
    volumes:
      - ./unbound.d:/etc/unbound/custom.conf.d
    restart: unless-stopped

networks:
  pihole_macvlan:
    external: true
    enable_ipv6: true
